
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Work Motivator | 上班鼓励器</title>
<style>
  
/* Work Motivator V2.0 Theme Colors */
:root {
  --theme-bg: #0d1220;
  --theme-card: #1a2336;
  --theme-text: #f3f5fc;
  --theme-accent: #f3c675;
}

body[data-theme="light"] {
  --theme-bg: #f1f5f9;
  --theme-card: #ffffff;
  --theme-text: #0f172a;
  --theme-accent: #2563eb;
}

body[data-theme="blue"] {
  --theme-bg: #081a38;
  --theme-card: #102c54;
  --theme-text: #f0f9ff;
  --theme-accent: #38bdf8;
}

body[data-theme="purple"] {
  --theme-bg: #21142f;
  --theme-card: #38244c;
  --theme-text: #faf5ff;
  --theme-accent: #c4b5fd;
}

body[data-theme="green"] {
  --theme-bg: #0c2621;
  --theme-card: #174238;
  --theme-text: #ecfdf5;
  --theme-accent: #6ee7b7;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--theme-bg);
  color:var(--theme-text);
  font-family:Arial,"Microsoft YaHei",sans-serif;
}

main{max-width:1120px;margin:auto;padding:36px 24px}
header{display:flex;justify-content:space-between;
align-items:center;margin-bottom:30px}
h1{font-size:26px;margin:0}
.sub{color:#96a3bd;font-size:13px;margin-top:8px}
.tag{color:#f4c875;border:1px solid #48516b;
border-radius:20px;padding:9px 14px;font-size:12px}
.grid{display:grid;grid-template-columns:1.4fr 1fr;
gap:20px}

.card{
  background:var(--theme-card);
  border:1px solid #303c54;
  border-radius:18px;
  padding:26px;
}

.card h2{font-size:16px;margin:0 0 22px}
.hero{text-align:center;padding:42px 20px}
.muted{color:#9daac2}
.timer{font-size:clamp(38px,5vw,65px);
font-weight:800;letter-spacing:2px;margin:18px 0;
font-variant-numeric:tabular-nums}

.gold{color:var(--theme-accent)}

.earned{font-size:clamp(32px,4vw,48px);
font-weight:800;color:#79e3b4;margin:12px 0;
overflow-wrap:anywhere}
.quote{font-size:20px;line-height:1.7;
min-height:72px;margin:24px 0}
button{border:0;background:#f3c675;color:#172033;
padding:13px 20px;border-radius:10px;font-size:15px;
font-weight:700;cursor:pointer}
button:hover{background:#ffda94}
label{display:block;color:#aebbd1;font-size:13px;
margin:16px 0 7px}
input,select{width:100%;background:#10182a;
border:1px solid #45516a;color:white;
border-radius:9px;padding:12px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);
gap:15px;margin-top:20px}
.stat{text-align:center}
.stat strong{display:block;font-size:22px;
color:#f3c675;margin-top:10px;overflow-wrap:anywhere}
.progress{height:11px;background:#35415a;
border-radius:20px;overflow:hidden;margin-top:18px}
.bar{height:100%;width:0;background:#79e3b4;
transition:width 1s}
footer{text-align:center;color:#71809b;
font-size:12px;margin-top:35px}
@media(max-width:760px){
.grid,.stats{grid-template-columns:1fr}
header{gap:12px}
.card{padding:20px}
}

/* V2.0 - Complete Theme Styling */

:root {
  --theme-muted: #9daac2;
  --theme-border: #303c54;
  --theme-input: #10182a;
  --theme-button-text: #172033;
}

body[data-theme="light"] {
  --theme-muted: #64748b;
  --theme-border: #cbd5e1;
  --theme-input: #f8fafc;
  --theme-button-text: #ffffff;
}

body[data-theme="blue"] {
  --theme-muted: #a5c9e9;
  --theme-border: #30527d;
  --theme-input: #0a2346;
  --theme-button-text: #081a38;
}

body[data-theme="purple"] {
  --theme-muted: #c8b6d8;
  --theme-border: #624979;
  --theme-input: #2b1b3c;
  --theme-button-text: #21142f;
}

body[data-theme="green"] {
  --theme-muted: #a3d6c5;
  --theme-border: #376a5a;
  --theme-input: #10352c;
  --theme-button-text: #0c2621;
}

/* Apply theme colors */

body {
  transition: background 0.3s, color 0.3s;
}

.card {
  border-color: var(--theme-border);
  transition: background 0.3s, border-color 0.3s;
}

.muted, .sub {
  color: var(--theme-muted);
}

button {
  background: var(--theme-accent);
  color: var(--theme-button-text);
}

button:hover {
  filter: brightness(1.08);
  background: var(--theme-accent);
}

input, select {
  background: var(--theme-input);
  color: var(--theme-text);
  border-color: var(--theme-border);
}

label {
  color: var(--theme-muted);
}

.stat strong, .quote {
  color: var(--theme-accent);
}

.tag {
  color: var(--theme-accent);
  border-color: var(--theme-border);
}

.progress {
  background: var(--theme-border);
}

.theme-selector {
  min-width: 170px;
}

.theme-selector label {
  margin: 0 0 6px;
}

.theme-selector select {
  cursor: pointer;
}

/* V2.0 Work Calendar Styling */

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 24px;
}

.calendar-header h2 {
  margin: 0;
}

.calendar-navigation {
  display: flex;
  align-items: center;
  gap: 16px;
}

.calendar-navigation button {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
}

#calendarMonth {
  min-width: 110px;
  text-align: center;
  font-weight: 700;
  color: var(--theme-text);
}

.calendar-weekdays,
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 8px;
}

.calendar-weekdays {
  margin-bottom: 10px;
}

.calendar-weekdays span {
  text-align: center;
  color: var(--theme-muted);
  font-size: 13px;
  padding: 10px 0;
}

.calendar-grid {
  min-height: 340px;
}

.calendar-day {
  min-height: 65px;
  padding: 10px;
  border-radius: 10px;
  background: var(--theme-input);
  border: 1px solid var(--theme-border);
  color: var(--theme-text);
  text-align: left;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.calendar-day:hover {
  border-color: var(--theme-accent);
}

.calendar-day.today {
  border: 2px solid var(--theme-accent);
}

.calendar-day.workday {
  background: color-mix(
    in srgb,
    var(--theme-accent) 12%,
    var(--theme-card)
  );
}

.calendar-day.restday {
  opacity: 0.7;
}

.calendar-day .day-number {
  font-weight: 700;
  font-size: 15px;
}

.calendar-day .day-income {
  font-size: 11px;
  margin-top: 8px;
  color: var(--theme-accent);
  overflow-wrap: anywhere;
}

.calendar-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 22px;
  font-size: 13px;
  color: var(--theme-muted);
}

@media (max-width: 760px) {
  .calendar-weekdays,
  .calendar-grid {
    gap: 4px;
  }

  .calendar-day {
    min-height: 48px;
    padding: 5px;
  }

  .calendar-day .day-number {
    font-size: 12px;
  }

  .calendar-day .day-income {
    font-size: 9px;
  }
}

</style>
</head>
<body>
<main>
<header>
<div>
<h1>💼 Work Motivator</h1>

</div>

</header>

<!-- V2.0 Date and Lunar Calendar -->
<section class="card date-panel" style="margin-bottom:20px">

<!-- V2.0 Work Calendar -->
<section class="card work-calendar" style="margin-top:20px">
  <div class="calendar-header">
    <h2>📅 我的工作日历</h2>

    <div class="calendar-navigation">

<script>
const $=id=>document.getElementById(id);
  
/* Work Motivator V2.0 - Theme System */
const themeSelect = $("themeSelect");

const availableThemes = [
  "dark",
  "light",
  "blue",
  "purple",
  "green"
];

let savedTheme = "dark";

try {
  const storedTheme = localStorage.getItem("workMotivatorTheme");

  if (availableThemes.includes(storedTheme)) {
    savedTheme = storedTheme;
  }
} catch (e) {
  console.log("Theme storage unavailable");
}

function applyTheme(theme) {
  if (!availableThemes.includes(theme)) {
    theme = "dark";
  }

  document.body.setAttribute("data-theme", theme);
  themeSelect.value = theme;

  try {
    localStorage.setItem("workMotivatorTheme", theme);
  } catch (e) {
    console.log("Unable to save theme");
  }
}

themeSelect.addEventListener("change", function () {
  applyTheme(this.value);
});

applyTheme(savedTheme);

const ids=["currency","salary","days","start","end","breaks"];
const symbols={
MYR:"RM",USD:"$",SGD:"S$",CNY:"¥",
TWD:"NT$",HKD:"HK$",VND:"₫",THB:"฿",
LKR:"Rs",EUR:"€"
};
const quotes=[
"努力工作不一定发财，但不工作一定没工资。",
"今天的努力，是明天的奶茶钱。",
"只要还没下班，就还有赚钱的机会。",
"工资正在到账的路上，坚持一下！",
"别看时间，看你已经赚了多少钱。",
"工作可以慢慢做，薪水必须准时发。",
"你的每一秒，都是有价值的。",
"距离财务自由，又努力了一天。",
"生活不止眼前的工作，还有下班后的快乐。",
"加油！距离下班又近了一秒。"
];

function randomQuote(){
let current=$("quote").textContent;
let options=quotes.filter(q=>q!==current);
$("quote").textContent=
options[Math.floor(Math.random()*options.length)];
}
$("quoteButton").addEventListener("click",randomQuote);

try{
const saved=JSON.parse(localStorage.getItem("workMotivatorSettings"));
if(saved){
ids.forEach(id=>{
if(saved[id]!==undefined)$(id).value=saved[id];
});
}
}catch(e){}

function save(){
let settings={};
ids.forEach(id=>settings[id]=$(id).value);
try{
localStorage.setItem("workMotivatorSettings",
JSON.stringify(settings));
}catch(e){}
update();
}
ids.forEach(id=>$(id).addEventListener("input",save));

function formatMoney(amount,decimals=2){
let currency=$("currency").value;
let symbol=symbols[currency]||currency;
return symbol+" "+amount.toLocaleString("en-US",{
minimumFractionDigits:decimals,
maximumFractionDigits:decimals
});
}
function timeMinutes(value){
let [h,m]=value.split(":").map(Number);
return h*60+m;
}

function clock(seconds) {
  seconds = Math.max(0, seconds);

  const totalCentiseconds = Math.floor(seconds * 100);

  const h = Math.floor(totalCentiseconds / 360000);
  const m = Math.floor((totalCentiseconds % 360000) / 6000);
  const s = Math.floor((totalCentiseconds % 6000) / 100);
  const cs = totalCentiseconds % 100;

  return [h, m, s]
    .map(v => String(v).padStart(2, "0"))
    .join(":") + "." + String(cs).padStart(2, "0");
}

function update(){
let salary=Number($("salary").value);
let days=Number($("days").value);
let breaks=Number($("breaks").value);
let start=timeMinutes($("start").value);
let end=timeMinutes($("end").value);
let duration=end-start;
let paidMinutes=duration-breaks;
let valid=Number.isFinite(salary)&&salary>=0&&
days>0&&days<=31&&breaks>=0&&paidMinutes>0;

if(!valid){
$("status").textContent="请检查薪水、工作天数及时间设置";
$("countdown").textContent="--:--:--";
$("earned").textContent="--";
$("workInfo").textContent="设置无效";
$("bar").style.width="0%";
["hourly","minute","second"].forEach(id=>$(id).textContent="--");
return;
}

let perSecond=salary/(days*paidMinutes*60);
$("hourly").textContent=formatMoney(perSecond*3600);
$("minute").textContent=formatMoney(perSecond*60,4);
$("second").textContent=formatMoney(perSecond,4);

let now=new Date();

let secondsNow = now.getHours() * 3600 +
  now.getMinutes() * 60 +
  now.getSeconds() +
  now.getMilliseconds() / 1000;

let startSeconds=start*60;
let endSeconds=end*60;
let elapsed=Math.max(0,Math.min(
secondsNow-startSeconds,duration*60));
let breakSeconds=breaks*60;
let paidElapsed=Math.max(0,elapsed-breakSeconds);
let earned=Math.min(salary/days,paidElapsed*perSecond);
let progress=elapsed/(duration*60)*100;

$("earned").textContent=formatMoney(earned,4);
$("bar").style.width=progress+"%";
$("workInfo").textContent=
"今日工作进度 "+progress.toFixed(1)+"%";

if(secondsNow<startSeconds){
$("countdown").textContent=clock(endSeconds-secondsNow);
$("status").textContent="还没上班，准备迎接新的一天";
}else if(secondsNow>=endSeconds){
$("countdown").textContent="00:00:00";
$("status").textContent="🎉 下班啦！辛苦了！";
}else{
$("countdown").textContent=clock(endSeconds-secondsNow);
$("status").textContent="正在上班 · 每一秒都在累积收入";
}
}
update();

setInterval(update, 30);


/* V2.0 - Date, Weekday and Chinese Lunar Date */

function updateDateDisplay() {
  const now = new Date();

  const solarFormatter = new Intl.DateTimeFormat(
    "zh-CN",
    {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "long"
    }
  );

  const lunarFormatter = new Intl.DateTimeFormat(
    "zh-CN-u-ca-chinese",
    {
      year: "numeric",
      month: "long",
      day: "numeric"
    }
  );

  const solarDate = solarFormatter.format(now);
  const lunarParts = lunarFormatter.formatToParts(now);

  const lunarMonth =
    lunarParts.find(p => p.type === "month")?.value || "";

  
const lunarDayNumber = Number(
  lunarParts.find(p => p.type === "day")?.value || 0
);

const lunarDayNames = [
  "",
  "初一", "初二", "初三", "初四", "初五",
  "初六", "初七", "初八", "初九", "初十",
  "十一", "十二", "十三", "十四", "十五",
  "十六", "十七", "十八", "十九", "二十",
  "廿一", "廿二", "廿三", "廿四", "廿五",
  "廿六", "廿七", "廿八", "廿九", "三十"
];

const lunarDay =
  lunarDayNames[lunarDayNumber] || "";


  const lunarYear =
    lunarParts.find(p => p.type === "relatedYear")?.value || "";

  $("currentDate").textContent = solarDate;

  
$("lunarDate").textContent =
  "农历：" + lunarYear + "年" +
  lunarMonth + lunarDay;

}

updateDateDisplay();
setInterval(updateDateDisplay, 60000);

/* V2.0 - Work Calendar Engine */


/* Calendar Data Storage */

const calendarStorageKey = "workMotivatorCalendar";

let calendarRecords = {};

try {
  const savedRecords = JSON.parse(
    localStorage.getItem(calendarStorageKey) || "{}"
  );

  if (
    savedRecords &&
    typeof savedRecords === "object" &&
    !Array.isArray(savedRecords)
  ) {
    calendarRecords = savedRecords;
  }
} catch (error) {
  console.warn("Calendar data could not be loaded", error);
}

function getCalendarDateKey(year, month, day) {
  return (
    year + "-" +
    String(month + 1).padStart(2, "0") + "-" +
    String(day).padStart(2, "0")
  );
}

function saveCalendarRecords() {
  try {
    localStorage.setItem(
      calendarStorageKey,
      JSON.stringify(calendarRecords)
    );
    return true;
  } catch (error) {
    console.error("Calendar data could not be saved", error);
    return false;
  }
}

  let calendarViewDate = new Date();
calendarViewDate.setDate(1);

function renderWorkCalendar() {
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();

  const calendarGrid = $("calendarGrid");
  const calendarMonth = $("calendarMonth");

  calendarGrid.innerHTML = "";

  calendarMonth.textContent =
    year + "年" + (month + 1) + "月";

  const firstDay = new Date(year, month, 1);
  const daysInMonth =
    new Date(year, month + 1, 0).getDate();

  // Monday = 0, Sunday = 6
  const startOffset = (firstDay.getDay() + 6) % 7;

  const today = new Date();

  // Add empty cells before the first day
  for (let i = 0; i < startOffset; i++) {
    const emptyCell = document.createElement("div");
    emptyCell.className = "calendar-empty";
    calendarGrid.appendChild(emptyCell);
  }

  // Generate each day of the month
  for (let day = 1; day <= daysInMonth; day++) {
    const date = new Date(year, month, day);
    const weekday = date.getDay();

    const dayCell = document.createElement("button");
    dayCell.type = "button";
    dayCell.className = "calendar-day";

    // Default: Monday-Friday workdays
    if (weekday === 0 || weekday === 6) {
      dayCell.classList.add("restday");
    } else {
      dayCell.classList.add("workday");
    }

    // Highlight today
    if (
      day === today.getDate() &&
      month === today.getMonth() &&
      year === today.getFullYear()
    ) {
      dayCell.classList.add("today");
    }

    const dayNumber = document.createElement("div");
    dayNumber.className = "day-number";
    dayNumber.textContent = day;

    dayCell.appendChild(dayNumber);
    calendarGrid.appendChild(dayCell);
  }
}

// Previous month
$("prevMonth").addEventListener("click", function () {
  calendarViewDate.setMonth(
    calendarViewDate.getMonth() - 1
  );
  renderWorkCalendar();
});

// Next month
$("nextMonth").addEventListener("click", function () {
  calendarViewDate.setMonth(
    calendarViewDate.getMonth() + 1
  );
  renderWorkCalendar();
});

// Initial render
renderWorkCalendar();

</script>
</body>
</html>
